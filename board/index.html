<!doctype html>
<html lang="de" translate="no">
<head>
<meta charset="utf-8">
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pi-Screen Board</title>
<link rel="stylesheet" href="board.css">
</head>
<body>
<div class="view view-board is-active" id="view-board" data-view="board">
  <img class="logo" src="assets/icf-logo-white.png" alt="ICF">

  <main class="stage">
    <section class="time">
      <div class="clock" id="clock">--:--</div>
      <div class="date" id="date"></div>
    </section>

    <div class="rule" aria-hidden="true"></div>

    <section class="verse">
      <p class="verse-text" id="verse-text"></p>
      <p class="verse-ref" id="verse-ref"></p>
    </section>
  </main>

  <footer class="claim">KIRCHE ERLEBEN</footer>

</div>

<!-- Stufe 2: Canva-Diashow. Wechsel per Pfeiltaste links/rechts. -->
<div class="view view-canva" id="view-canva" data-view="canva" aria-hidden="true">
  <iframe id="canva-frame" translate="no" title="Canva-Diashow" tabindex="-1"
          allow="fullscreen; autoplay" referrerpolicy="strict-origin-when-cross-origin"></iframe>
  <!-- Fängt Maus/Touch ab, damit das iframe nie den Tastaturfokus bekommt -->
  <div class="canva-shield" id="canva-shield"></div>
  <div class="canva-hint" id="canva-hint" hidden></div>
</div>

<!-- Looker-Studio-Bericht. Zwei iframes: die nächste Seite lädt verdeckt. -->
<div class="view view-looker" id="view-looker" data-view="looker" aria-hidden="true">
  <iframe id="looker-frame-a" class="looker-frame is-front" title="Looker Studio" tabindex="-1" translate="no"
          allowfullscreen sandbox="allow-scripts allow-same-origin allow-popups"></iframe>
  <iframe id="looker-frame-b" class="looker-frame" title="Looker Studio" tabindex="-1" translate="no"
          allowfullscreen sandbox="allow-scripts allow-same-origin allow-popups"></iframe>
  <div class="canva-shield"></div>
  <div class="canva-hint" id="looker-hint" hidden></div>
</div>

  <!-- board-config.js liefert nur der lokale Board-Server (scripts/board-server.py). -->
  <script src="board-config.js"></script>
  <script src="verses.js"></script>
  <script src="board.js"></script>
  <script src="views.js"></script>
</body>
</html>
